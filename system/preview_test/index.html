<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pet Recognition System Preview</title>
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            --bg-color: #fdf6e3;
            --text-color: #333;
            --secondary-text: #888;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft Yahei", sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Dynamic Pet Background */
        .pet-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            opacity: 0.7;
            animation: float 20s infinite ease-in-out alternate;
        }

        .blob-1 { width: 450px; height: 450px; background: radial-gradient(circle, #ff9a9e 0%, #fecfef 100%); top: -100px; left: -50px; animation-duration: 25s; }
        .blob-2 { width: 400px; height: 400px; background: radial-gradient(circle, #a18cd1 0%, #fbc2eb 100%); bottom: -50px; right: -100px; animation-duration: 30s; animation-direction: alternate-reverse; }
        .blob-3 { width: 350px; height: 350px; background: radial-gradient(circle, #ffd194 0%, #70e1f5 100%); top: 40%; left: 30%; animation-duration: 22s; opacity: 0.6; }
        .blob-4 { width: 250px; height: 250px; background: #84fab0; bottom: 20%; left: 10%; filter: blur(50px); animation-duration: 18s; opacity: 0.5; }

        @keyframes float {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(30px, 50px) rotate(10deg); }
            100% { transform: translate(-20px, 20px) rotate(-10deg); }
        }

        .paw-print {
            position: absolute;
            font-size: 40px;
            opacity: 0.15;
            color: #ff9a9e;
            animation: floatPaw 15s infinite linear;
            user-select: none;
            z-index: 1;
        }

        .paw-1 { top: 15%; left: 10%; animation-duration: 12s; font-size: 50px; transform: rotate(-20deg); }
        .paw-2 { top: 75%; left: 15%; animation-duration: 18s; font-size: 30px; transform: rotate(10deg); }
        .paw-3 { top: 20%; right: 15%; animation-duration: 15s; font-size: 60px; transform: rotate(15deg); }
        .paw-4 { bottom: 10%; right: 25%; animation-duration: 20s; font-size: 40px; transform: rotate(-10deg); }

        @keyframes floatPaw {
            0% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.1; }
            50% { transform: translateY(-20px) rotate(10deg) scale(1.1); opacity: 0.2; }
            100% { transform: translateY(0) rotate(0deg) scale(1); opacity: 0.1; }
        }

        /* Glassmorphism Card */
        .container {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 360px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border-radius: 30px;
            padding: 48px 36px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.1), 0 10px 20px rgba(0, 0, 0, 0.05), inset 0 0 0 1px rgba(255, 255, 255, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.6);
            animation: floatUp 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
            text-align: center;
        }

        @keyframes floatUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Typography & Icons */
        .header { margin-bottom: 40px; }

        .logo-container {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 64px;
            height: 64px;
            background: var(--primary-gradient);
            border-radius: 20px;
            margin-bottom: 16px;
            box-shadow: 0 8px 16px rgba(255, 154, 158, 0.3);
            color: white;
        }

        .pet-icon { width: 36px; height: 36px; fill: currentColor; }

        h1 { font-size: 26px; font-weight: 700; color: var(--text-color); margin: 0 0 8px 0; letter-spacing: -0.5px; }
        p.subtitle { font-size: 14px; color: var(--secondary-text); font-weight: 500; margin: 0; letter-spacing: 0.5px; }

        /* Form */
        .form-group { margin-bottom: 32px; }
        .input-wrapper { margin-bottom: 20px; }

        input {
            width: 100%;
            height: 56px;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid transparent;
            border-radius: 16px;
            padding: 0 20px;
            font-size: 16px;
            color: var(--text-color);
            box-sizing: border-box;
            transition: all 0.3s ease;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
            outline: none;
        }

        input:focus {
            background: #ffffff;
            border-color: #ff9a9e;
            box-shadow: 0 0 0 4px rgba(255, 154, 158, 0.15);
        }

        button {
            width: 100%;
            height: 56px;
            background: var(--primary-gradient);
            color: #ffffff;
            font-size: 18px;
            font-weight: 600;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(255, 154, 158, 0.3);
        }

        button:hover { transform: translateY(-2px); box-shadow: 0 15px 25px rgba(255, 154, 158, 0.4); }
        button:active { transform: scale(0.98); box-shadow: 0 5px 15px rgba(255, 154, 158, 0.3); }
        button:disabled { background: #d1d1d6; box-shadow: none; cursor: not-allowed; transform: none; }

        #result { margin-top: 20px; font-size: 14px; color: var(--secondary-text); min-height: 20px; }
        .success { color: #34C759; }
        .error { color: #FF3B30; }
        
        /* Spinner */
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: #ffffff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="pet-bg">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
        <div class="paw-print paw-1">🐾</div>
        <div class="paw-print paw-2">🐾</div>
        <div class="paw-print paw-3">🐾</div>
        <div class="paw-print paw-4">🐾</div>
    </div>

    <div class="container">
        <div class="header">
            <div class="logo-container">
                <svg class="pet-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C10.3431 2 9 3.34315 9 5C9 6.65685 10.3431 8 12 8C13.6569 8 15 6.65685 15 5C15 3.34315 13.6569 2 12 2Z"/>
                    <path d="M5 6C3.34315 6 2 7.34315 2 9C2 10.6569 3.34315 12 5 12C6.65685 12 8 10.6569 8 9C8 7.34315 6.65685 6 5 6Z"/>
                    <path d="M19 6C17.3431 6 16 7.34315 16 9C16 10.6569 17.3431 12 19 12C20.6569 12 22 10.6569 22 9C22 7.34315 20.6569 6 19 6Z"/>
                    <path d="M7.64044 14.5658C6.18222 15.0061 5.03403 16.3248 5.00164 17.848C4.9575 19.9238 6.74682 21.6881 8.82522 21.5036C10.0381 21.396 11.134 20.6861 11.75 19.645C11.8953 19.3995 12.1047 19.3995 12.25 19.645C12.866 20.6861 13.9619 21.396 15.1748 21.5036C17.2532 21.6881 19.0425 19.9238 18.9984 17.848C18.966 16.3248 17.8178 15.0061 16.3596 14.5658C14.9554 14.1419 13.4836 13.9984 12.0001 13.9996C10.5165 13.9984 9.04469 14.1419 7.64044 14.5658Z"/>
                </svg>
            </div>
            <h1>宠物识别系统</h1>
            <p class="subtitle">AI 智能识别 · 关爱每一个生命</p>
        </div>
        
        <div class="form-group">
            <div class="input-wrapper">
                <input type="text" id="username" value="admin" placeholder="请输入用户名">
            </div>
            <div class="input-wrapper">
                <input type="password" id="password" value="admin" placeholder="请输入密码">
            </div>
        </div>

        <button id="loginBtn" onclick="login()">立 即 登 录</button>
        <div id="result"></div>
    </div>

    <script>
        const API_URL = 'http://127.0.0.1:8000/api/v1';

        async function login() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const resultDiv = document.getElementById('result');
            const btn = document.getElementById('loginBtn');
            
            btn.innerHTML = '<div class="spinner"></div>';
            btn.disabled = true;
            resultDiv.innerHTML = '';

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    resultDiv.innerHTML = '<span class="success">验证通过，正在跳转...</span>';
                    setTimeout(() => {
                        resultDiv.innerHTML = `<span class="success">欢迎回来，${username}</span>`;
                        btn.innerHTML = '登 录 成 功';
                    }, 800);
                } else {
                    resultDiv.innerHTML = `<span class="error">${data.detail || '登录失败'}</span>`;
                    btn.innerHTML = '立 即 登 录';
                    btn.disabled = false;
                }
            } catch (error) {
                resultDiv.innerHTML = `<span class="error">连接服务器失败</span>`;
                btn.innerHTML = '立 即 登 录';
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
